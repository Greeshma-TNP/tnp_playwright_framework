[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tnp_playwright_framework"
version = "0.1.0"
description = "Reusable Playwright actions for TNP test projects"
requires-python = ">=3.9"
dependencies = ["playwright", "pytest", "pytest-playwright", "openpyxl", "requests"]

[tool.setuptools]
packages = ["framework", "config"]
